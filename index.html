<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1115">
<title>桌面助手 v4.1</title>
<style>
:root{
  --bg:#0f1115;--panel:#171a21;--panel2:#1f242d;--text:#f5f7fa;
  --muted:#98a3b3;--line:#2a313c;--accent:#7da2ff;--up:#ff6b6b;--down:#55c78a;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
button{font:inherit}
.safe{
  width:100%;height:100dvh;overflow:hidden;
  padding:max(env(safe-area-inset-top,0px),12px)
          max(env(safe-area-inset-right,0px),22px)
          max(env(safe-area-inset-bottom,0px),12px)
          max(env(safe-area-inset-left,0px),22px);
}
.app{width:100%;height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:8px}
.top{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.clock{font-weight:800;line-height:.88;letter-spacing:-2px;font-size:clamp(42px,10vh,72px);font-variant-numeric:tabular-nums}
.date{margin-top:6px;color:var(--muted);font-size:clamp(12px,2.3vh,17px)}
.weather{
  min-width:180px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:11px 14px;text-align:right
}
.weatherTitle{color:var(--muted);font-size:clamp(11px,1.9vh,14px)}
.weatherMain{display:flex;justify-content:flex-end;align-items:baseline;gap:8px;margin-top:2px}
.temp{font-size:clamp(24px,5vh,38px);font-weight:780}
.condition{font-size:clamp(12px,2.1vh,16px);font-weight:650}
.weatherSub{color:var(--muted);font-size:clamp(10px,1.6vh,12px);margin-top:5px}

.main{min-height:0;display:grid;grid-template-columns:.82fr 1.68fr;gap:8px}
.card{min-width:0;min-height:0;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:13px}
.cardTitle{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:clamp(11px,1.9vh,14px);margin-bottom:8px}
.statusCard{display:flex;flex-direction:column;justify-content:space-between}
.statusBig{font-size:clamp(22px,4.7vh,38px);font-weight:760;line-height:1.15;margin-top:6px}
.statusNote{color:var(--muted);font-size:clamp(11px,1.8vh,13px);line-height:1.55;margin-top:8px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pill{padding:5px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:clamp(10px,1.6vh,12px);color:#c7d0dc}

.market{display:grid;grid-template-rows:repeat(5,1fr);height:calc(100% - 24px);min-height:0}
.marketRow{
  display:grid;grid-template-columns:1.45fr .7fr .55fr;align-items:center;gap:8px;
  border-bottom:1px solid var(--line);min-height:0;padding:3px 2px
}
.marketRow:last-child{border-bottom:none}
.name{min-width:0}
.nameMain{font-size:clamp(12px,2.2vh,16px);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code{font-size:clamp(9px,1.45vh,11px);color:var(--muted);margin-top:1px}
.price{text-align:right;font-size:clamp(15px,2.8vh,21px);font-weight:730;font-variant-numeric:tabular-nums}
.chg{text-align:right;font-size:clamp(12px,2.1vh,16px);font-weight:720;font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}

.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:10px}
.actions{display:flex;gap:6px}
.btn{border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--text);padding:5px 8px;font-size:10px}
.btn.good{border-color:#315846;color:#a6e8c6}

@media (orientation:portrait){
  .safe{
    padding:max(env(safe-area-inset-top,0px),22px)
            max(env(safe-area-inset-right,0px),12px)
            max(env(safe-area-inset-bottom,0px),22px)
            max(env(safe-area-inset-left,0px),12px);
  }
  .weather{min-width:145px;padding:10px 11px}
  .main{grid-template-columns:1fr;grid-template-rows:.62fr 1.38fr}
}
</style>
</head>
<body>
<div class="safe">
<div class="app">
  <header class="top">
    <div>
      <div id="clock" class="clock">--:--</div>
      <div id="date" class="date">----</div>
    </div>
    <section class="weather">
      <div class="weatherTitle">上海 · 实时天气</div>
      <div class="weatherMain">
        <div id="temp" class="temp">--°</div>
        <div id="condition" class="condition">获取中</div>
      </div>
      <div id="weatherSub" class="weatherSub">体感 --° · 湿度 --%</div>
    </section>
  </header>

  <main class="main">
    <section class="card statusCard">
      <div>
        <div class="cardTitle"><span>今日状态</span><span id="dayTag">--</span></div>
        <div id="greeting" class="statusBig">上午好</div>
        <div class="statusNote">只保留真正需要的信息：时间、天气和关注标的。</div>
        <div class="pills">
          <span class="pill" id="weekPill">星期--</span>
          <span class="pill" id="marketPill">A股状态 --</span>
          <span class="pill" id="weatherPill">天气 --</span>
        </div>
      </div>
      <div class="statusNote">无 Excel · 无手工录入 · 行情自动刷新</div>
    </section>

    <section class="card">
      <div class="cardTitle">
        <span>市场关注</span>
        <span id="quoteState">等待行情</span>
      </div>
      <div class="market">
        <div class="marketRow">
          <div class="name"><div class="nameMain">红利低波100ETF博时</div><div class="code">159307</div></div>
          <div id="p159307" class="price">--</div><div id="c159307" class="chg flat">--</div>
        </div>
        <div class="marketRow">
          <div class="name"><div class="nameMain">恒生科技指数</div><div class="code">HSTECH</div></div>
          <div id="pHSTECH" class="price">--</div><div id="cHSTECH" class="chg flat">--</div>
        </div>
        <div class="marketRow">
          <div class="name"><div class="nameMain">黄金9999</div><div class="code">AU9999</div></div>
          <div id="pAU9999" class="price">--</div><div id="cAU9999" class="chg flat">--</div>
        </div>
        <div class="marketRow">
          <div class="name"><div class="nameMain">中粮糖业</div><div class="code">600737</div></div>
          <div id="p600737" class="price">--</div><div id="c600737" class="chg flat">--</div>
        </div>
        <div class="marketRow">
          <div class="name"><div class="nameMain">沪深300</div><div class="code">000300</div></div>
          <div id="p000300" class="price">--</div><div id="c000300" class="chg flat">--</div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span id="updateText">桌面助手 v4.1</span>
    <div class="actions">
      <button id="wakeBtn" class="btn">保持亮屏</button>
      <button id="fullBtn" class="btn">全屏</button>
    </div>
  </footer>
</div>
</div>

<script>
const $=id=>document.getElementById(id);

function updateClock(){
  const now=new Date();
  $('clock').textContent=now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});
  $('date').textContent=now.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
  const h=now.getHours();
  $('greeting').textContent=h<6?'夜深了':h<9?'早上好':h<12?'上午好':h<14?'中午好':h<18?'下午好':h<22?'晚上好':'夜深了';
  const wd=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  $('weekPill').textContent=wd[now.getDay()];
  $('dayTag').textContent=`${now.getMonth()+1}/${now.getDate()}`;
  const d=now.getDay(),m=now.getHours()*60+now.getMinutes();
  let s='A股休市';
  if(d>=1&&d<=5){
    if((m>=570&&m<690)||(m>=780&&m<900))s='A股交易中';
    else if(m>=690&&m<780)s='A股午休';
    else if(m<570)s='A股待开盘';
  }
  $('marketPill').textContent=s;
}
setInterval(updateClock,1000);updateClock();

const weatherText=code=>({
  0:'晴',1:'大部晴朗',2:'多云',3:'阴',45:'有雾',48:'雾凇',
  51:'小毛毛雨',53:'毛毛雨',55:'较强毛毛雨',
  61:'小雨',63:'中雨',65:'大雨',71:'小雪',73:'中雪',75:'大雪',
  80:'阵雨',81:'较强阵雨',82:'强阵雨',95:'雷雨',96:'雷雨',99:'强雷雨'
})[code]||'天气变化';

async function loadWeather(){
  try{
    const u='https://api.open-meteo.com/v1/forecast?latitude=31.2304&longitude=121.4737&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code&timezone=Asia%2FShanghai';
    const r=await fetch(u,{cache:'no-store'}); if(!r.ok)throw new Error();
    const c=(await r.json()).current,cond=weatherText(c.weather_code);
    $('temp').textContent=Math.round(c.temperature_2m)+'°';
    $('condition').textContent=cond;
    $('weatherSub').textContent=`体感 ${Math.round(c.apparent_temperature)}° · 湿度 ${c.relative_humidity_2m}%`;
    $('weatherPill').textContent='天气 '+cond;
  }catch(e){
    $('condition').textContent='暂不可用';
    $('weatherSub').textContent='联网后自动重试';
    $('weatherPill').textContent='天气未连接';
  }
}
loadWeather();setInterval(loadWeather,15*60*1000);

/* 东方财富行情接口。页面自己画 UI，不加载第三方行情组件。 */
const QUOTES=[
  {key:'159307',secid:'0.159307',scale:1000},
  {key:'HSTECH',secid:'124.HSTECH',scale:100},
  {key:'AU9999',secid:'118.AU9999',scale:100},
  {key:'600737',secid:'1.600737',scale:100},
  {key:'000300',secid:'1.000300',scale:100}
];

function setQuote(key,price,chg){
  const p=$('p'+key),c=$('c'+key);
  p.textContent=price;
  if(Number.isFinite(chg)){
    c.textContent=(chg>0?'+':'')+chg.toFixed(2)+'%';
    c.className='chg '+(chg>0?'up':chg<0?'down':'flat');
  }else{
    c.textContent='--';c.className='chg flat';
  }
}

async function getQuote(q){
  const fields='f43,f57,f58,f170';
  const u=`https://push2.eastmoney.com/api/qt/stock/get?secid=${encodeURIComponent(q.secid)}&fields=${fields}&ut=fa5fd1943c7b386f172d6893dbfba10b`;
  const r=await fetch(u,{cache:'no-store',mode:'cors'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();
  const d=j&&j.data;
  if(!d||d.f43===null||d.f43==='-')throw new Error('no data');
  const raw=Number(d.f43),chg=Number(d.f170)/100;
  let price=raw/q.scale;
  const digits=q.key==='159307'?3:q.key==='600737'?2:q.key==='AU9999'?2:2;
  return {price:price.toFixed(digits),chg};
}

async function loadQuotes(){
  $('quoteState').textContent='正在刷新';
  let ok=0;
  await Promise.all(QUOTES.map(async q=>{
    try{
      const x=await getQuote(q);
      setQuote(q.key,x.price,x.chg);ok++;
    }catch(e){
      setQuote(q.key,'--',NaN);
    }
  }));
  const t=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});
  $('quoteState').textContent=ok===QUOTES.length?`更新 ${t}`:`${ok}/5 已更新`;
  $('updateText').textContent=`行情 ${t}`;
}
loadQuotes();setInterval(loadQuotes,60*1000);

let wakeLock=null;
async function requestWakeLock(){
  try{
    wakeLock=await navigator.wakeLock.request('screen');
    $('wakeBtn').textContent='已保持亮屏';$('wakeBtn').classList.add('good');
    wakeLock.addEventListener('release',()=>{$('wakeBtn').textContent='保持亮屏';$('wakeBtn').classList.remove('good')});
  }catch(e){$('wakeBtn').textContent='亮屏失败'}
}
$('wakeBtn').addEventListener('click',requestWakeLock);
$('fullBtn').addEventListener('click',async()=>{
  try{
    if(!document.fullscreenElement){await document.documentElement.requestFullscreen();$('fullBtn').textContent='退出全屏'}
    else{await document.exitFullscreen();$('fullBtn').textContent='全屏'}
  }catch(e){}
});
document.addEventListener('fullscreenchange',()=>{$('fullBtn').textContent=document.fullscreenElement?'退出全屏':'全屏'});
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d11">
<title>桌面助手 v4.9 · 公众号 + Obsidian知识库</title>
<style>
:root{
  --bg:#0a0d12;--panel:#141922;--panel2:#1c2330;--text:#eef2f7;
  --muted:#8f9aaa;--line:#27303c;--accent:#7fa2ff;--up:#ff6b6b;--down:#5ccf91;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
button{font:inherit}
.safe{
  width:100%;height:100dvh;overflow:hidden;
  padding:max(env(safe-area-inset-top,0px),12px)
          max(env(safe-area-inset-right,0px),22px)
          max(env(safe-area-inset-bottom,0px),12px)
          max(env(safe-area-inset-left,0px),22px);
}
.app{
  width:100%;height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:8px;
  transform:translate(var(--shiftX,0px),var(--shiftY,0px));
  transition:transform 1.2s ease;
}
.top{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.clock{
  font-weight:780;line-height:.9;letter-spacing:-1.5px;
  font-size:clamp(34px,7.6vh,56px);font-variant-numeric:tabular-nums
}
.date{margin-top:3px;color:var(--muted);font-size:clamp(11px,1.9vh,15px)}
.weather{
  min-width:188px;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:7px 11px;text-align:right
}
.weatherTitle,.cardTitle{color:var(--muted);font-size:clamp(11px,1.8vh,14px)}
.weatherMain{display:flex;justify-content:flex-end;align-items:baseline;gap:8px;margin-top:2px}
.temp{font-size:clamp(24px,5vh,38px);font-weight:760}
.condition{font-size:clamp(12px,2vh,15px);font-weight:620}
.weatherSub{color:var(--muted);font-size:clamp(10px,1.5vh,12px);margin-top:4px}

.main{min-height:0;display:block}
.left{height:100%;min-height:0;display:grid;grid-template-columns:1.15fr .9fr 1.05fr;grid-template-rows:1fr;gap:8px}
.card{
  min-width:0;min-height:0;overflow:hidden;background:var(--panel);
  border:1px solid var(--line);border-radius:18px;padding:10px 12px
}
.cardTitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.quote{
  font-size:clamp(15px,2.7vh,22px);font-weight:640;line-height:1.25;margin-top:4px
}
.quoteAuthor{margin-top:4px;color:var(--muted);font-size:clamp(9px,1.4vh,11px)}

.todayGrid{
  display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:4px
}
.metricLabel{color:var(--muted);font-size:clamp(9px,1.45vh,11px)}
.metricValue{font-size:clamp(14px,2.25vh,18px);font-weight:680;margin-top:0}
.progress{
  height:5px;background:var(--panel2);border-radius:999px;overflow:hidden;margin-top:5px
}
.progressBar{height:100%;width:0;background:var(--accent);border-radius:999px}
.progressText{display:flex;justify-content:space-between;color:var(--muted);font-size:9px;margin-top:3px}



.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:10px}
.actions{display:flex;gap:6px}
.btn{
  border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--text);
  padding:5px 8px;font-size:10px
}
.btn.good{border-color:#315846;color:#a6e8c6}
.dimmed{filter:brightness(.78)}

@media (orientation:portrait){
  .safe{
    padding:max(env(safe-area-inset-top,0px),22px)
            max(env(safe-area-inset-right,0px),12px)
            max(env(safe-area-inset-bottom,0px),22px)
            max(env(safe-area-inset-left,0px),12px);
  }
  .weather{min-width:155px;padding:9px 10px}
  .main{display:block}
  .left{grid-template-columns:1fr;grid-template-rows:auto auto auto}
  .left .quoteCard{grid-column:auto}
  }

@media (orientation:landscape) and (max-height:760px){
  .safe{padding-top:8px;padding-bottom:8px}
  .app{gap:6px}
  .top{gap:8px}
  .date{margin-top:4px;font-size:12px}
  .weather{padding:8px 11px}
  .weatherSub{margin-top:2px}
  .main{display:block}
  .left{grid-template-columns:1.15fr .9fr 1.05fr;gap:6px;height:100%}
  .card{border-radius:16px;padding:9px 11px}
  .cardTitle{margin-bottom:4px}
  .quote{font-size:19px;line-height:1.22;margin-top:2px}
  .quoteAuthor{margin-top:4px}
  .todayCompact{gap:4px;margin-top:2px}
  .todayCompact>div{padding:4px 5px}
  .todayCompact strong{font-size:14px}
    .hourly{margin-top:4px}
  .hour{padding:2px}
        .footer{font-size:9px}
  .btn{padding:4px 7px}
}


.todayCompactCard{padding-top:9px;padding-bottom:8px}
.todayCompact{
  display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:3px
}
.todayCompact>div{
  min-width:0;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;padding:5px 6px
}
.todayCompact .metricLabel{display:block;font-size:9px;color:var(--muted);white-space:nowrap}
.todayCompact strong{
  display:block;margin-top:1px;font-size:clamp(12px,2vh,16px);
  font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}


@media (orientation:landscape) and (max-height:720px){
  .safe{padding:6px 16px 6px 16px}
  .app{gap:5px}
  .top{min-height:118px}
  .clock{font-size:52px}
  .date{font-size:12px}
  .weather{min-width:188px;padding:7px 11px}
  .weatherTitle{font-size:11px}
  .temp{font-size:30px}
  .condition{font-size:12px}
  .weatherSub{font-size:10px}
  .main{display:block}
  .left{grid-template-columns:1.15fr .9fr 1.05fr;gap:6px;height:100%}
  .card{padding:8px 10px;border-radius:15px}
  .cardTitle{font-size:11px;margin-bottom:3px}
  .quote{font-size:18px;line-height:1.2;margin-top:2px}
  .quoteAuthor{font-size:9px;margin-top:3px}
  .todayCompactCard{padding-top:8px;padding-bottom:7px}
  .todayCompact{gap:3px;margin-top:2px}
  .todayCompact>div{padding:3px 5px}
  .todayCompact .metricLabel{font-size:8px}
  .todayCompact strong{font-size:13px}
  .progress{margin-top:4px}
  .progressText{font-size:8px;margin-top:2px}
                .footer{font-size:9px}
  .btn{padding:3px 7px}
}


.quoteCard,.todayCompactCard,.left>section.card{display:flex;flex-direction:column}
.quoteCard,.todayCompactCard,.left>section.card:last-child{justify-content:center}
.quoteCard .quote{font-size:clamp(22px,4.2vh,34px);line-height:1.35}
.todayCompact{grid-template-columns:1fr 1fr;gap:8px}
.todayCompact>div{padding:10px 12px}
.todayCompact strong{font-size:clamp(18px,3vh,24px)}
@media (orientation:landscape) and (max-height:720px){
  .quoteCard .quote{font-size:24px;line-height:1.3}
  .todayCompact{gap:6px}
  .todayCompact>div{padding:7px 8px}
  .todayCompact strong{font-size:16px}
        }


.knowledgeCard{
  justify-content:flex-start!important;
  padding:14px 16px!important;
}
.knowledgeMeta{display:flex;align-items:center;gap:8px;margin-top:4px;min-width:0}
.knowledgeChip{
  flex:0 0 auto;padding:4px 8px;border-radius:999px;background:var(--panel2);
  border:1px solid var(--line);color:#b8c8ea;font-size:10px
}
.knowledgeTitle{
  min-width:0;color:#cfd7e3;font-size:clamp(11px,1.8vh,14px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.knowledgeText{
  margin-top:12px;font-size:clamp(19px,3.45vh,28px);
  line-height:1.38;font-weight:670;letter-spacing:.01em
}
.knowledgePoint{
  margin-top:12px;padding:9px 10px;border-left:3px solid var(--accent);
  background:rgba(127,162,255,.07);border-radius:0 10px 10px 0;
  color:#b8c2d0;font-size:clamp(10px,1.7vh,13px);line-height:1.45
}
.knowledgeSource{
  margin-top:auto;padding-top:10px;color:var(--muted);
  font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
@media (orientation:landscape){
  .left{grid-template-columns:.86fr .72fr 1.62fr!important}
}
@media (orientation:landscape) and (max-height:720px){
  .knowledgeCard{padding:10px 12px!important}
  .knowledgeMeta{margin-top:2px}
  .knowledgeChip{font-size:9px;padding:3px 7px}
  .knowledgeTitle{font-size:10px}
  .knowledgeText{margin-top:8px;font-size:20px;line-height:1.3}
  .knowledgePoint{margin-top:8px;padding:7px 9px;font-size:10px;line-height:1.35}
  .knowledgeSource{padding-top:7px;font-size:8px}
}

</style>
</head>
<body>
<div class="safe">
<div class="app" id="app">

<header class="top">

    <div id="clock" class="clock">--:--</div>

  </div>
  <section class="weather">

      <div id="temp" class="temp">--°</div>

    <button id="fullBtn" class="btn">全屏</button>

</div>

<script>
const $=id=>document.getElementById(id);

function pad(n){return String(n).padStart(2,'0')}
function getISOWeek(date){
  const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
  const dayNum=d.getUTCDay()||7;
  d.setUTCDate(d.getUTCDate()+4-dayNum);
  const yearStart=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d-yearStart)/86400000)+1)/7);
}
function updateClock(){
  const now=new Date();
  $('clock').textContent=now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});
  $('date').textContent=now.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});

  const y=now.getFullYear();
  const start=new Date(y,0,1), end=new Date(y+1,0,1);
  const dayNo=Math.floor((new Date(y,now.getMonth(),now.getDate())-start)/86400000)+1;
  const total=Math.round((end-start)/86400000);
  const pct=(dayNo/total*100);
  const weekdays=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

  $('dayOfYear').textContent=`第 ${dayNo} 天`;
  $('weekNo').textContent=`第 ${getISOWeek(now)} 周`;
  $('weekday').textContent=weekdays[now.getDay()];
  $('yearPercent').textContent=pct.toFixed(1)+'%';
  $('daysLeft').textContent=(total-dayNo)+' 天';
  $('yearBar').style.width=pct+'%';
  $('yearProgressText').textContent=`${y} · ${pct.toFixed(1)}%`;

}
setInterval(updateClock,1000); updateClock();

function excerptIndexForToday(){
  const n=new Date();
  const start=new Date(n.getFullYear(),0,1);
  const day=Math.floor((new Date(n.getFullYear(),n.getMonth(),n.getDate())-start)/86400000);
  return (day+17)%knowledgeBase.length;
}
function showExcerpt(){
  const i=excerptIndexForToday();
  const k=knowledgeBase[i];
  $('quote').textContent=k.point;
  $('quoteAuthor').textContent='— '+k.source;
  $('quoteNo').textContent=String(i+1).padStart(2,'0');
}
showExcerpt();
setInterval(showExcerpt,60*60*1000);

function shiftUI(){
  const x=Math.floor(Math.random()*9)-4;
  const y=Math.floor(Math.random()*7)-3;
  document.documentElement.style.setProperty('--shiftX',x+'px');
  document.documentElement.style.setProperty('--shiftY',y+'px');
}
shiftUI(); setInterval(shiftUI,5*60*1000);

function setNightDim(){
  const h=new Date().getHours();
  document.body.classList.toggle('dimmed',h<7||h>=20);
}
setNightDim(); setInterval(setNightDim,10*60*1000);

const weatherText=code=>({
  0:'晴',1:'大部晴朗',2:'多云',3:'阴',45:'有雾',48:'雾凇',
  51:'小毛毛雨',53:'毛毛雨',55:'较强毛毛雨',
  61:'小雨',63:'中雨',65:'大雨',71:'小雪',73:'中雪',75:'大雪',
  80:'阵雨',81:'较强阵雨',82:'强阵雨',95:'雷雨',96:'雷雨',99:'强雷雨'
})[code]||'天气变化';

async function loadWeather(){
  try{
    const u='https://api.open-meteo.com/v1/forecast?latitude=31.2304&longitude=121.4737&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code&timezone=Asia%2FShanghai';
    const r=await fetch(u,{cache:'no-store'}); if(!r.ok)throw new Error();
    const d=await r.json(),c=d.current;
    const cond=weatherText(c.weather_code);
    $('temp').textContent=Math.round(c.temperature_2m)+'°';
    $('condition').textContent=cond;
    $('weatherSub').textContent=`体感 ${Math.round(c.apparent_temperature)}° · 湿度 ${c.relative_humidity_2m}%`;
  }catch(e){
    $('condition').textContent='暂不可用';
    $('weatherSub').textContent='联网后自动重试';
  }
}
loadWeather(); setInterval(loadWeather,15*60*1000);


const knowledgeBase=[{"category":"全光网","title":"医院项目慎用 GPON","text":"全光网不能只看“光纤替代铜缆”这一点。医院采用 GPON 时，还要同时考虑带宽共享、ONU 安装位置、分光器部署、弱电间空间和保护机制。","point":"设计时先把故障边界、维护位置和扩展方式画清楚，再判断它是否真的比传统以太网更合适。","source":"郁见智能化｜全光网设计相关文章"},{"category":"全光网","title":"ONU 的位置会影响维护","text":"ONU 放在哪里，不只是安装问题，还决定了供电、检修、散热和后期更换是否方便。","point":"如果 ONU 分散隐藏在吊顶或信息箱内，施工看似简化了，后期维护成本可能反而增加。","source":"郁见智能化｜全光网设计相关文章"},{"category":"全光网","title":"分光器不是“放得下就行”","text":"分光器部署需要同时考虑光纤路由、端口编号、检修空间和业务调整。","point":"设计阶段应明确分光级数和安装位置，避免施工后才临时寻找弱电间或箱体空间。","source":"郁见智能化｜全光网设计相关文章"},{"category":"网络","title":"三层架构要和光缆能力匹配","text":"网络采用核心—汇聚—接入三层架构后，汇聚到核心的上联带宽往往显著提高，光缆类型也必须跟着重新核算。","point":"不能一边设计 40G 上联，一边仍按低速率条件下的多模光缆距离经验直接套用。","source":"郁见智能化｜网络架构相关文章"},{"category":"网络","title":"多模光缆要看速率和距离","text":"同一根 OM3 多模光缆，在 10G、40G 等不同速率下允许的传输距离并不相同。","point":"判断“这根光缆能不能用”时，必须把速率、模块类型和实际链路长度放在一起看。","source":"郁见智能化｜网络架构相关文章"},{"category":"网络","title":"留扩展，不等于无限堆配置","text":"网络设计中的扩展性，重点是保留合理的端口、带宽、槽位和路由弹性，而不是简单把所有设备选到最大。","point":"真正的余量应该服务于未来变化，而不是制造当前阶段的浪费。","source":"郁见智能化｜网络设计经验"},{"category":"综合布线","title":"先统一表头，再谈自动汇总","text":"用 Power Query 汇总多个系统清单前，最重要的准备工作不是写代码，而是先统一各表需要汇总的列和表头。","point":"源数据结构不统一，后面的自动化越复杂，维护成本越高。","source":"郁见智能化｜Power Query 清单汇总文章"},{"category":"Power Query","title":"超级表是稳定数据源","text":"把每张系统清单转换为 Excel 超级表，再按统一规则命名，可以让 Power Query 更稳定地识别和汇总数据。","point":"源表发生变化后，只需刷新查询，不必反复复制粘贴。","source":"郁见智能化｜Power Query 清单汇总文章"},{"category":"Power Query","title":"Power Query 只处理数据","text":"Power Query 很适合清洗、合并、筛选和变换数据，但它不负责 Excel 单元格格式。","point":"字体、填充色、边框等提交版样式，应留在查询结果加载完成后由 Excel 处理。","source":"郁见智能化｜Power Query 清单汇总文章"},{"category":"Power Query","title":"自动化首先要减少重复动作","text":"清单自动汇总的价值，不是代码本身，而是把重复的复制、粘贴、排序和合并变成一次配置、持续刷新。","point":"好的工具流程应该让源数据变化后只需要“全部刷新”。","source":"郁见智能化｜Power Query 清单汇总文章"},{"category":"弱电信号","title":"先判断信号属于哪一类","text":"弱电智能化设备的接口，可以先从电压、电流、开关量和协议四类信号去理解。","point":"先搞清楚信号和电源，很多设备接口问题就已经解决了物理层和电气链路层的大半。","source":"郁见智能化｜弱电信号类型文章"},{"category":"弱电信号","title":"开关量表达的是状态","text":"开关量最核心的含义不是“有没有电”，而是通过通断或高低状态表达一个离散事件。","point":"设计联动接口时，应明确常开/常闭、无源/有源以及异常状态下的逻辑。","source":"郁见智能化｜弱电信号类型文章"},{"category":"弱电信号","title":"协议决定设备能否真正交流","text":"两台设备都接上网线，并不代表它们一定能互通；物理连接成立以后，还要看双方是否支持一致的通信协议和数据定义。","point":"系统集成时，接口类型和协议兼容性要分别确认。","source":"郁见智能化｜弱电信号类型文章"},{"category":"音频","title":"距离加倍，声压会下降","text":"在自由声场近似条件下，距离声源每增加一倍，声压级理论上约下降 6 dB。","point":"这条规律可以帮助快速理解扬声器覆盖、安装距离和声压余量之间的关系。","source":"郁见智能化｜音频设计指南"},{"category":"音频","title":"最大声压级与峰值要分清","text":"看扬声器参数时，“最大声压级”和“峰值声压级”不是同一个概念，不能只挑数字更大的那个比较。","point":"很多产品资料中峰值会比持续/最大指标高约 6 dB，比较设备时必须统一口径。","source":"郁见智能化｜音频设计指南"},{"category":"音频","title":"频响曲线比“频率范围”更有信息","text":"扬声器标称频率范围只能告诉你大致能发出哪些频率，频响曲线才能看到不同频段的实际响应是否均衡。","point":"选型和调试时，不要只盯着“xx Hz～xx kHz”这一行参数。","source":"郁见智能化｜音频设计指南"},{"category":"音频","title":"高通滤波器用于保护低频能力","text":"扬声器无法有效重放的超低频，不仅没有听感收益，还会浪费功放余量并增加单元负担。","point":"高通滤波器的设置应结合扬声器频响和系统用途，而不是机械套一个固定频率。","source":"郁见智能化｜音频设计指南"},{"category":"音频","title":"极坐标图决定覆盖角度怎么理解","text":"扬声器水平面、垂直面的极坐标图反映不同频率下声能向各方向分布的情况。","point":"看覆盖角时要注意频率，因为同一只扬声器在不同频段的指向性可能明显不同。","source":"郁见智能化｜音频设计指南"},{"category":"会议音视频","title":"显示设备要从场景出发","text":"投影机、液晶电视、拼接屏、LED 大屏和 LED 一体机没有绝对优劣，核心是观看距离、环境光、画面尺寸和使用方式。","point":"先确定场景，再选技术路线，比先定品牌型号更可靠。","source":"郁见智能化｜会议音视频系统文章"},{"category":"会议音视频","title":"高反射空间先解决可懂度","text":"游泳馆、体育馆等硬质表面多、混响时间长的空间，扩声设计的首要目标往往不是“更响”，而是让语言可懂。","point":"扬声器指向、分区、延时和声学条件需要一起考虑。","source":"郁见智能化｜会议音视频设计经验"},{"category":"视频监控","title":"摄像机布点要用“看什么”解释","text":"摄像机数量不是设计目标，真正要说明的是它需要识别人、看清活动、记录车辆，还是覆盖某个区域。","point":"先定义监视目标，再决定焦距、安装位置和覆盖距离。","source":"郁见智能化｜视频监控设计经验"},{"category":"视频监控","title":"走廊覆盖不能只追求越远越好","text":"摄像机看得越远，单位目标在画面中的像素就越少。走廊布点应在覆盖长度与目标细节之间取得平衡。","point":"设计时要避免用一只摄像机承担过长距离的人员特征识别。","source":"郁见智能化｜视频监控设计经验"},{"category":"安防","title":"门禁点位应由场所风险解释","text":"门禁设计不能只写“这里设置一套门禁”，更重要的是说明这个场所为什么需要权限控制。","point":"用场所风险等级解释点位，比单纯罗列设备数量更有设计逻辑。","source":"郁见智能化｜安防系统设计经验"},{"category":"安防","title":"消防联动要考虑安全等级差异","text":"火灾报警后，门禁和闸机通常需要释放，但重要机房、重要库房等高安全等级场所可能有不同要求。","point":"“全部开门”这种一句话式设计往往过于粗糙，应结合场所性质明确联动逻辑。","source":"郁见智能化｜出入口控制设计经验"},{"category":"机房","title":"机房墙体不能只看表面材料","text":"机房墙面采用金属彩钢板时，真正影响牢固度和后期挂装能力的，还有背衬板、龙骨规格和基层做法。","point":"设备安装荷载最终要传递到可靠的结构或基层上。","source":"郁见智能化｜机房设计经验文章"},{"category":"机房","title":"龙骨选型要和荷载对应","text":"C75、C100 等轻钢龙骨的选择不能只凭习惯，要结合墙高、设备挂装和构造受力进行判断。","point":"设计大样图时，材料规格和受力路径必须能够对应起来。","source":"郁见智能化｜机房设计经验文章"},{"category":"机房","title":"散力架的意义是把荷载传出去","text":"机房设备或构件不能可靠固定在轻质墙体上时，需要通过散力架等构造把荷载传递到楼板、梁或其他可靠结构。","point":"画出散力架只是第一步，还要核对它究竟把力传到了哪里。","source":"郁见智能化｜机房设计经验文章"},{"category":"UPS","title":"远距离供电要核算压降","text":"UPS 给远端弱电间供电时，线缆截面不能只按载流量选择，还要同时检查线路电压降。","point":"距离越长、负荷越大，压降越可能成为比载流量更早触发的约束条件。","source":"郁见智能化｜UPS 远距离供电文章"},{"category":"UPS","title":"三级配电要兼顾三相平衡","text":"多个弱电间由 UPS 集中供电时，可以按若干弱电间分组形成三级配电，并尽量让三相负载保持平衡。","point":"分组数量不是固定公式，应结合实际负荷和楼层分布调整。","source":"郁见智能化｜UPS 配电设计文章"},{"category":"CAD","title":"图层管理决定后期修改成本","text":"CAD 图纸里所有内容都堆在少数几个图层，短期看省事，后期修改、出图和协同都会变得困难。","point":"图层的价值是把不同性质的对象分开管理，而不是只为了换颜色。","source":"郁见智能化｜CAD 绘图禁忌文章"},{"category":"CAD","title":"图块要服务于重复修改","text":"重复出现的设备如果各画各的，修改一次就要到处找。规范图块可以把重复对象变成可统一维护的设计元素。","point":"设备符号、属性和命名规则越统一，后期统计和修改越可靠。","source":"郁见智能化｜CAD 绘图禁忌文章"},{"category":"CAD","title":"图例必须和图纸实际一致","text":"图例不是装饰。图纸里出现的线型、符号和设备表达，应与图例保持一致。","point":"错误或过期的图例很容易让施工和审图人员产生错误理解。","source":"郁见智能化｜CAD 绘图禁忌文章"},{"category":"设计方法","title":"先明确边界，再谈深化","text":"弱电设计里很多争议不是技术本身，而是设计、总包、专业承包和设备厂家的工作边界没有写清楚。","point":"界面划分越早明确，后期变更、报价和责任争议越少。","source":"郁见智能化｜工程设计经验"},{"category":"设计方法","title":"设备清单不能替代设计逻辑","text":"设备数量只能说明“买什么”，不能完整说明“为什么这样设计”。","point":"好的系统说明应让读者只看正文，也能理解架构、布点原则和关键参数。","source":"郁见智能化｜工程设计经验"},{"category":"设计方法","title":"设计余量要有依据","text":"“留一点余量”不是随意放大设备容量，而应根据端口增长、带宽增长、备用路由和未来业务变化设置。","point":"能解释余量来自哪里，才是可审查、可复核的设计。","source":"郁见智能化｜工程设计经验"},{"category":"信息箱","title":"信息箱空间要按真实设备算","text":"户内信息箱不能只看模块数量，还要考虑路由器、交换机、电源适配器、光纤盘留和实际插拔空间。","point":"纸面上“装得下”和现场真正方便安装维护是两回事。","source":"郁见智能化｜户内信息箱文章"},{"category":"综合布线","title":"预留信息点也要明确终点","text":"即使某些信息点只做管线和网线预留，也应明确网线最终接到哪里、是否进入配线架、是否配置交换机端口。","point":"“只预留”不能等于“边界不清楚”。","source":"郁见智能化｜综合布线设计经验"},{"category":"无线网络","title":"AP 点位必须结合现场复核","text":"按覆盖半径初步布置 AP 只能用于方案阶段，最终点位还要结合隔墙、装修、天花和厂家射频仿真复核。","point":"无线覆盖不是在平面图上画几个圆就结束了。","source":"郁见智能化｜无线网络设计经验"},{"category":"停车系统","title":"先画清车辆流向再布道闸","text":"停车系统最容易出错的不是设备参数，而是入口、出口、坡道和车行路径理解错误。","point":"在确定道闸数量和方向前，先把车辆从室外到各层、再离场的完整路径走一遍。","source":"郁见智能化｜停车系统设计经验"},{"category":"工程表达","title":"变更说明先记录事实","text":"技术核定和设计变更最稳妥的写法，是先客观说明现状、变化和需要确认的事项，而不是急着判断责任归属。","point":"事实清楚、前后对比明确，往往比解释谁对谁错更有效。","source":"郁见智能化｜工程沟通经验"},{"category":"布线","title":"HDMI 成品线穿管要看接头，不只看线径","text":"HDMI 成品线穿管时，真正容易卡住的往往不是线身，而是接头尺寸和弯曲半径。","point":"选管径时，应同时核对接头最大外形、线缆数量、弯曲半径和弯头数量，不能只按电缆外径估算。","source":"Obsidian｜HDMI布线"},{"category":"管线","title":"JDG25 还是 JDG32，要看四个条件","text":"JDG 管径选择至少要同时考虑线缆数量、线缆外径、成品接头尺寸和弯曲半径。","point":"成品 HDMI、USB 等带接头线缆，比普通散线更容易受穿管条件限制。","source":"Obsidian｜JDG管径选择"},{"category":"接地","title":"智能讲台通常不需要再单独拉一根接地线","text":"希沃 TSD07Y 智能讲台正常采用三芯电源供电时，只要 PE 保护地线可靠连接，无需另外增加独立接地线。","point":"设计图中预留正常带保护地线的电源即可，不必重复设置独立接地端子。","source":"Obsidian｜希沃TSD07Y智能讲台接地"},{"category":"接地","title":"保护接地的目的不是“多接一根线”","text":"设备保护接地，是把设备可导电外壳与保护接地系统可靠连接，降低绝缘故障时的触电风险。","point":"判断设备是否需要额外接地，应先确认供电方式、PE 连接和厂家要求，而不是看到金属外壳就一律另拉地线。","source":"Obsidian｜设备保护接地"},{"category":"智慧教室","title":"智慧教室设备要区分基础配置和可选配置","text":"86 英寸互动屏、OPS 电脑、音箱、音频处理器和无线话筒通常属于核心设备；实物展台、智能讲台、触控桌面屏、时序电源可按需求配置。","point":"做清单时先区分“必须实现功能的设备”和“体验增强设备”，有助于控制范围和造价。","source":"Obsidian｜希沃设备（智慧教室相关）"},{"category":"智慧教室","title":"触控桌面屏不是只接一根显示线","text":"触控桌面屏与 86 英寸互动屏之间，除了 HDMI 图像链路，还需要 USB 2.0 Type-A 转 Type-B 连接来实现触控交互。","point":"设计时要同时预留图像和触控两条链路，不能把它当成普通副屏。","source":"Obsidian｜希沃设备（智慧教室相关）"},{"category":"智慧教室","title":"实物展台的 USB 线同时承担供电和图像","text":"实物展台连接互动屏的 USB 2.0 线，不只是传输数据，还可能同时承担设备供电。","point":"长距离时应优先采用原厂配套或厂家确认兼容的高质量成品线，避免供电和传输稳定性问题。","source":"Obsidian｜希沃设备（智慧教室相关）"},{"category":"无线话筒","title":"红外话筒接收机能藏，红外传感器不能藏","text":"红外无线话筒接收机可以安装在智能讲台或机柜内，但红外传感器必须布置在外部并保持无遮挡。","point":"红外链路依赖光学视距，传感器如果被柜体、装饰或设备遮挡，会直接影响接收可靠性。","source":"Obsidian｜希沃设备（智慧教室相关）"},{"category":"无线话筒","title":"红外传感器优先考虑吸顶明装","text":"红外传感器宜安装在讲台或机柜外部，并保持无遮挡；吸顶明装更容易获得稳定的红外覆盖。","point":"安装方式要服务于信号覆盖，不应为了隐藏设备把传感器塞进柜体或吊顶内部。","source":"Obsidian｜希沃设备（智慧教室相关）"},{"category":"设计复核","title":"未确认的厂家参数不要直接写成设计结论","text":"设备安装深度、传感器尺寸、固定方式、无线制式等，如果厂家资料没有明确，应保留“待确认”状态。","point":"把“推测”和“厂家已确认参数”分开记录，可以避免深化阶段把未经证实的信息固化到图纸或清单里。","source":"Obsidian｜希沃设备（智慧教室相关）"},{"category":"综合布线","title":"教室信息点最好按设备功能成组规划","text":"电子班牌、无线 AP、IP 广播、互动屏和讲台设备的信息点，应结合各自安装位置一次性规划，而不是后期零散补点。","point":"设备位置、信息点、强电和预埋底盒应同步考虑，避免弱电点位到了现场才发现没有电源或安装空间。","source":"Obsidian｜教室内信息点布点原则"},{"category":"综合布线","title":"互动屏信息点建议保留备用","text":"教室黑板侧墙面居中位置，为 86 英寸互动屏预留 2 个信息点，其中 1 个使用、1 个备用。","point":"互动教学设备迭代快，适度预留端口可以降低后期改造成本。","source":"Obsidian｜教室内信息点布点原则"},{"category":"综合布线","title":"讲台位置的信息点要和音频处理器一起考虑","text":"讲台位置可预留 2 个信息点，服务于讲台内音频处理器等设备，并保留一定冗余。","point":"讲台不是单纯家具，它往往同时承载音频、控制、触控和网络设备，应按小型设备节点来设计。","source":"Obsidian｜教室内信息点布点原则"},{"category":"设计复核","title":"安装高度必须以装饰完成面为基准复核","text":"电子班牌、广播、互动屏等设备的预留高度，最终都应结合装饰完成面和设备深化尺寸复核。","point":"建筑底图上的原始标高不能直接等同于最终安装高度，尤其是有地台、吊顶或墙面饰面的空间。","source":"Obsidian｜教室内信息点布点原则"}];

function knowledgeIndexForToday(){
  const n=new Date();
  const start=new Date(n.getFullYear(),0,1);
  const day=Math.floor((new Date(n.getFullYear(),n.getMonth(),n.getDate())-start)/86400000);
  return day%knowledgeBase.length;
}
function showKnowledge(){
  const i=knowledgeIndexForToday();
  const k=knowledgeBase[i];
  $('knowledgeNo').textContent=`${String(i+1).padStart(2,'0')} / ${knowledgeBase.length}`;
  $('knowledgeCategory').textContent=k.category;
  $('knowledgeTitle').textContent=k.title;
  $('knowledgeText').textContent=k.text;
  $('knowledgePoint').textContent=k.point;
  $('knowledgeSource').textContent='来源：'+k.source;
}
showKnowledge();
setInterval(showKnowledge,60*60*1000);

let wakeLock=null;
async function requestWakeLock(){
  try{
    wakeLock=await navigator.wakeLock.request('screen');
    $('wakeBtn').textContent='已保持亮屏';$('wakeBtn').classList.add('good');
    wakeLock.addEventListener('release',()=>{
      $('wakeBtn').textContent='保持亮屏';$('wakeBtn').classList.remove('good')
    });
  }catch(e){$('wakeBtn').textContent='亮屏失败'}
}
$('wakeBtn').addEventListener('click',requestWakeLock);
$('fullBtn').addEventListener('click',async()=>{
  try{
    if(!document.fullscreenElement){
      await document.documentElement.requestFullscreen();$('fullBtn').textContent='退出全屏'
    }else{
      await document.exitFullscreen();$('fullBtn').textContent='全屏'
    }
  }catch(e){}
});
document.addEventListener('fullscreenchange',()=>{
  $('fullBtn').textContent=document.fullscreenElement?'退出全屏':'全屏'
});
</script>
